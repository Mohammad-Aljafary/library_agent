services:
  ollama:
    image: ollama/ollama:latest
    container_name: library-ollama
    volumes:
      - ollama_data:/root/.ollama
    expose:
      - "11434"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: library-app
    expose:
      - "${APP_PORT:-8000}"
    environment:
      - DATABASE_HOST=${DATABASE_HOST:-sqlite:///./db/library.db}
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_MODEL=${OLLAMA_MODEL:-qwen2.5:3b}
      - APP_PORT=${APP_PORT:-8000}
      - APP_HOST=${APP_HOST:-0.0.0.0}
      - CORS_ORIGINS=${CORS_ORIGINS:-*}
      - OLLAMA_TEMPERATURE=${OLLAMA_TEMPERATURE:-0}
      - OLLAMA_NUM_PREDICT=${OLLAMA_NUM_PREDICT:-2048}
      - MAX_CHAT_HISTORY=${MAX_CHAT_HISTORY:-20}
    volumes:
      - ./db:/app/db
      - ./app:/app/app
      - ./server:/app/server
      - ./prompts:/app/prompts
    depends_on:
      ollama:
        condition: service_healthy
    restart: unless-stopped
    command: >
      sh -c "
        echo 'Pulling model in background...' &&
        (wget -q -O /dev/null --post-data='{\"name\":\"'$$OLLAMA_MODEL'\"}' --header='Content-Type: application/json' http://ollama:11434/api/pull 2>&1 &) &&
        echo 'Starting server...' &&
        uvicorn server.main:app --host $$APP_HOST --port $$APP_PORT --reload
      "

  nginx:
    image: nginx:alpine
    container_name: library-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - app
    restart: unless-stopped

volumes:
  ollama_data:
