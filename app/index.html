<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="/favicon.ico" type="image/x-icon" />
  <title>Library Desk Agent</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      display: flex;
      height: 100vh;
      background: #f5f5f5;
      color: #1a1a1a;
    }

    /* ── Sidebar ── */
    #sidebar {
      width: 260px;
      min-width: 260px;
      background: #1c1c2e;
      color: #e0e0e0;
      display: flex;
      flex-direction: column;
      padding: 16px;
      gap: 8px;
      overflow-y: auto;
    }

    #sidebar-header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding-bottom: 12px;
      border-bottom: 1px solid #2e2e4e;
      margin-bottom: 4px;
    }

    #sidebar-header h1 {
      font-size: 15px;
      font-weight: 600;
      color: #c9b8ff;
    }

    #sidebar-header .logo {
      font-size: 22px;
    }

    #new-session-btn {
      width: 100%;
      background: #6c63ff;
      color: #fff;
      border: none;
      padding: 10px 14px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: background 0.2s;
    }

    #new-session-btn:hover { background: #5a52d5; }

    #sessions-label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #888;
      padding: 8px 4px 4px;
    }

    #session-list {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .session-item {
      background: transparent;
      border: none;
      color: #ccc;
      padding: 9px 12px;
      border-radius: 7px;
      cursor: pointer;
      text-align: left;
      font-size: 13px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      transition: background 0.15s;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .session-item:hover { background: #2e2e4e; }
    .session-item.active { background: #6c63ff22; color: #c9b8ff; border-left: 3px solid #6c63ff; }

    .session-text {
      flex: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .delete-session-btn {
      background: transparent;
      border: none;
      color: #888;
      cursor: pointer;
      padding: 4px 6px;
      border-radius: 4px;
      font-size: 14px;
      opacity: 0;
      transition: all 0.2s;
      flex-shrink: 0;
    }

    .session-item:hover .delete-session-btn {
      opacity: 1;
    }

    .delete-session-btn:hover {
      background: #ff4444;
      color: #fff;
    }

    /* ── Main ── */
    #main {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── Topbar ── */
    #topbar {
      background: #fff;
      border-bottom: 1px solid #e5e5e5;
      padding: 14px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    #topbar-title {
      font-size: 15px;
      font-weight: 600;
      color: #333;
    }

    #status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #ccc;
      display: inline-block;
      margin-right: 6px;
      transition: background 0.3s;
    }

    #status-dot.online { background: #22c55e; }
    #status-text { font-size: 12px; color: #888; }

    /* ── Messages ── */
    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .empty-state {
      margin: auto;
      text-align: center;
      color: #aaa;
    }

    .empty-state .empty-icon { font-size: 48px; margin-bottom: 12px; }
    .empty-state p { font-size: 14px; }

    .message-row {
      display: flex;
      gap: 10px;
      align-items: flex-start;
    }

    .message-row.user { flex-direction: row-reverse; }

    .avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      flex-shrink: 0;
      margin-top: 2px;
    }

    .avatar.user-avatar { background: #6c63ff;
      color: #fff; }
    .avatar.agent-avatar { background: #1c1c2e; color: #c9b8ff; }

    .bubble {
      max-width: 68%;
      padding: 12px 16px;
      border-radius: 14px;
      font-size: 14px;
      line-height: 1.6;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .bubble ul, .bubble ol {
      margin: 8px 0;
      padding-left: 20px;
    }

    .bubble li {
      margin: 4px 0;
    }

    .message-row.user .bubble {
      background: #6c63ff;
      color: #fff;
      border-bottom-right-radius: 3px;
    }

    .message-row.assistant .bubble {
      background: #fff;
      color: #1a1a1a;
      border-bottom-left-radius: 3px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.08);
    }

    .typing-indicator span {
      display: inline-block;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #aaa;
      animation: blink 1.2s infinite;
    }

    .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
    .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }

    @keyframes blink {
      0%, 80%, 100% { opacity: 0.2; transform: scale(0.85); }
      40% { opacity: 1; transform: scale(1); }
    }

    /* ── Quick prompts ── */
    #quick-prompts {
      padding: 0 24px 12px;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .quick-btn {
      background: #fff;
      border: 1px solid #e0e0e0;
      padding: 7px 13px;
      border-radius: 20px;
      font-size: 12px;
      cursor: pointer;
      color: #555;
      transition: all 0.15s;
    }

    .quick-btn:hover { background: #6c63ff; color: #fff; border-color: #6c63ff; }

    /* ── Input area ── */
    #input-area {
      background: #fff;
      border-top: 1px solid #e5e5e5;
      padding: 16px 24px;
      display: flex;
      gap: 10px;
      align-items: flex-end;
    }

    #user-input {
      flex: 1;
      padding: 12px 16px;
      border: 1.5px solid #e0e0e0;
      border-radius: 12px;
      font-size: 14px;
      font-family: inherit;
      resize: none;
      outline: none;
      min-height: 46px;
      max-height: 140px;
      line-height: 1.5;
      transition: border-color 0.2s;
    }

    #user-input:focus { border-color: #6c63ff; }
    #user-input::placeholder { color: #bbb; }

    #send-btn {
      width: 46px;
      height: 46px;
      border-radius: 12px;
      background: #6c63ff;
      color: #fff;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      flex-shrink: 0;
      transition: background 0.2s, transform 0.1s;
    }

    #send-btn:hover:not(:disabled) { background: #5a52d5; }
    #send-btn:active:not(:disabled) { transform: scale(0.95); }
    #send-btn:disabled { background: #ccc; cursor: not-allowed; }
  </style>
</head>
<body>

  <!-- Sidebar -->
  <div id="sidebar">
    <div id="sidebar-header">
      <span class="logo">📚</span>
      <h1>Library Agent</h1>
    </div>
    <button id="new-session-btn">＋ New Chat</button>
    <div id="sessions-label">Sessions</div>
    <div id="session-list"></div>
  </div>

  <!-- Main -->
  <div id="main">

    <!-- Topbar -->
    <div id="topbar">
      <span id="topbar-title">Library Desk Agent</span>
      <div>
        <span id="status-dot"></span>
        <span id="status-text">Select or start a session</span>
      </div>
    </div>

    <!-- Messages -->
    <div id="messages">
      <div class="empty-state">
        <div class="empty-icon">📖</div>
        <p>Start a new chat or load a session</p>
      </div>
    </div>

    <!-- Quick prompts -->
    <div id="quick-prompts">
      <button class="quick-btn" data-prompt="List all books by Robert C. Martin">Books by Robert Martin</button>
      <button class="quick-btn" data-prompt="Show inventory summary">Inventory summary</button>
      <button class="quick-btn" data-prompt="What is the status of order 1?">Order status</button>
      <button class="quick-btn" data-prompt="List all books by Andrew Hunt">Books by Andrew Hunt</button>
    </div>

    <!-- Input -->
    <div id="input-area">
      <textarea id="user-input" rows="1" placeholder="Ask the library agent..."></textarea>
      <button id="send-btn" disabled>&#9658;</button>
    </div>

  </div>

  <script src="main.js?v=2"></script>
</body>
</html>
